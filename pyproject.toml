[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linxsci"
version = "0.3.3"
description = "LinxSci OpenAPI v2 CLI and Python client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://linxsci.com"
Repository = "https://github.com/LinxSci/linxsci-skills"
Documentation = "https://github.com/LinxSci/linxsci-skills/blob/main/README.md"
Issues = "https://github.com/LinxSci/linxsci-skills/issues"

[project.scripts]
linxsci = "linxsci.scripts.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["linxsci", "linxsci.scripts"]
package-dir = {"linxsci" = "skills/linxsci-base"}

[tool.setuptools.package-data]
# Keep the wheel's public Skill resources explicit; local notes are not package data.
linxsci = [
    "SKILL.md", "SKILL.zh-CN.md", "service.json", "agents/openai.yaml",
    "references/api.md", "references/api.zh-CN.md",
    "references/cli.md", "references/cli.zh-CN.md",
]
