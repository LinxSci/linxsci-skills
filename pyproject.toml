[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linxsci-scholar-sdk"
version = "0.2.2"
description = "Scholar OpenAPI v2 CLI and Python client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
linxsci-scholar = "linxsci_scholar.scripts.scholar:main"

[tool.setuptools]
include-package-data = false
py-modules = ["scholar", "scholar_client"]
packages = ["linxsci_scholar", "linxsci_scholar.scripts"]
package-dir = {"linxsci_scholar" = "skills/linxsci-scholar"}

[tool.setuptools.package-data]
linxsci_scholar = ["SKILL.md", "service.json", "agents/*.yaml", "references/*.md"]
