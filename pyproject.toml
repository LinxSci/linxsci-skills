[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linxsci"
version = "0.3.1"
description = "LinxSci OpenAPI v2 CLI and Python client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://linxsci.com"
Repository = "https://github.com/LinxSci/linxsci-skills"
Documentation = "https://github.com/LinxSci/linxsci-skills/blob/main/README.md"
Issues = "https://github.com/LinxSci/linxsci-skills/issues"

[project.scripts]
linxsci = "linxsci.scripts.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["linxsci", "linxsci.scripts"]
package-dir = {"linxsci" = "skills/linxsci-skills"}

[tool.setuptools.package-data]
linxsci = ["SKILL.md", "SKILL.zh-CN.md", "service.json", "agents/*.yaml", "references/*.md"]
