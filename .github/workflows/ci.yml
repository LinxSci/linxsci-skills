name: Tests and release packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install build twine uv
      - run: python -m pip install -e .
      - run: linxsci --version
      - name: Run regression tests
        run: python -m unittest discover -s tests -v > test-results.txt 2>&1
      - name: Report test failures
        if: failure()
        run: python -c "from pathlib import Path; p = Path('test-results.txt'); text = p.read_text(encoding='utf-8') if p.exists() else 'Tests did not start'; print('::error::' + text[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
      - run: python tools/build_release.py
      - run: python tools/check_release.py dist
      - run: python tools/smoke_release.py dist --uv uv
      - run: python -m pip install --no-deps dist/linxsci-0.3.1-py3-none-any.whl
      - run: linxsci --version
      - run: linxsci install-skill --skills-dir smoke/skills
      - run: python smoke/skills/linxsci-skills/scripts/cli.py routes
