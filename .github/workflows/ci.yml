name: Tests and release packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install build twine uv
      - run: python -m pip install -e .
      - run: linxsci --version
      - name: Run regression tests
        run: python -m unittest discover -s tests -v > test-results.txt 2>&1
      - run: python tools/build_release.py
      - run: python tools/check_release.py dist > release-check.txt 2>&1
      - run: python tools/smoke_release.py dist --uv uv > release-smoke.txt 2>&1
      - run: python -m pip install --no-deps dist/linxsci-0.3.1-py3-none-any.whl
      - run: linxsci --version
      - run: linxsci install-skill --skills-dir smoke/skills
      - run: python smoke/skills/linxsci-skills/scripts/cli.py routes
      - name: Report failed check diagnostics
        if: failure()
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          for name in ('test-results.txt', 'release-check.txt', 'release-smoke.txt'):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for start in range(0, len(text), 2000):
                  chunk = text[start:start + 2000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=' + name + '::' + chunk)
          PYCODE
