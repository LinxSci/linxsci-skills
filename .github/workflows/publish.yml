name: Publish GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version tag
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version, 'Publish from the matching version tag'
          PY
      - run: python -m pip install build twine uv
      - name: Build or recover immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir dist
            gh release download "$GITHUB_REF_NAME" --dir dist
          else
            python tools/build_release.py
          fi
          python tools/check_release.py dist
          python tools/smoke_release.py dist --uv uv
      - name: Publish GitHub downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
              --title "LinxSci $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
